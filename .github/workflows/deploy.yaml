name: Deploy to GitHub Pages

on:
  push:
    branches:
      - mainline

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: itsclept/itsclept.github.io
          publish_branch: mainline
          publish_dir: ./dist
          cname: www.clept.dev
          force_orphan: true
